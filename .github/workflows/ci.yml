name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage
        continue-on-error: false

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Package dry run
        run: npm pack --dry-run --json

      - name: Packed consumer smoke
        run: npm run test:package-consumer

  shell-contracts:
    name: Bash, ShellCheck, shfmt & Bats
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install shell test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats shellcheck shfmt util-linux proot

      - name: Bash syntax
        run: |
          for script in \
            scripts/freebuff-wrapper.sh \
            scripts/install.sh \
            scripts/remote-install.sh \
            scripts/manage.sh \
            scripts/release-artifact-verify.sh \
            scripts/release-preflight.sh \
            scripts/xdg-open-bridge.sh \
            scripts/lib/install-transaction.sh \
            skill/freebuff-hermes-integration/scripts/health_check.sh; do
            bash -n "$script"
          done

      - name: ShellCheck
        run: |
          shellcheck --severity=warning \
            scripts/freebuff-wrapper.sh \
            scripts/install.sh \
            scripts/remote-install.sh \
            scripts/manage.sh \
            scripts/release-artifact-verify.sh \
            scripts/release-preflight.sh \
            scripts/xdg-open-bridge.sh \
            scripts/lib/install-transaction.sh \
            skill/freebuff-hermes-integration/scripts/health_check.sh

      - name: shfmt
        run: |
          shfmt -d -i 4 -ci -bn \
            scripts/freebuff-wrapper.sh \
            scripts/install.sh \
            scripts/remote-install.sh \
            scripts/manage.sh \
            scripts/release-artifact-verify.sh \
            scripts/release-preflight.sh \
            scripts/xdg-open-bridge.sh \
            scripts/lib/install-transaction.sh \
            skill/freebuff-hermes-integration/scripts/health_check.sh

      - name: Bats
        run: bats tests/shell

      - name: Full installer hard-crash recovery
        run: |
          BATS_BIN="$(command -v bats)"
          sudo env FREEBUFF_RUN_INSTALLER_INTEGRATION=1 \
            "${BATS_BIN}" tests/shell/installer-integration.bats
